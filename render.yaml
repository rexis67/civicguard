services:
  - type: web
    name: civicguard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTHORITY_INVITE_CODE
        sync: false
      - key: AUTHORITY_EMAIL_DOMAINS
        value: ""
      # No SMTP is provisioned by this blueprint, so registration hands the
      # verification link back to the browser. Set to false once SMTP is set.
      - key: RETURN_VERIFICATION_LINK
        value: "true"
      - key: CIVICGUARD_DB_PATH
        value: /data/civicguard.sqlite
      - key: CIVICGUARD_REPORTS_PATH
        value: /data/reports.json
      - key: UPLOAD_DIR
        value: /data/uploads
      # Seeds 12 realistic, pre-triaged incidents into an empty volume on first
      # boot so the deployed demo is never empty. Remove for a real deployment.
      - key: SEED_DEMO_DATA
        value: "true"
    disk:
      name: civicguard-data
      mountPath: /data
      sizeGB: 1
