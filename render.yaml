services:
  - type: web
    name: civicguard
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render Free: 512 MB RAM, sleeps after 15 minutes idle, no card required.
    # This is enough for the hackathon demo; data is ephemeral (see the comment
    # at the end of this service).
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects RENDER_EXTERNAL_URL, so verification links and the
      # sitemap use the real public origin without trusting the Host header.
      - key: SERVE_STATIC
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTHORITY_INVITE_CODE
        sync: false
      - key: AUTHORITY_EMAIL_DOMAINS
        value: ""
      # No SMTP is provisioned by this blueprint, so registration hands the
      # verification link back only to a caller that proves the account
      # password. Set to false once SMTP is configured.
      - key: RETURN_VERIFICATION_LINK
        value: "true"
      - key: CIVICGUARD_DB_PATH
        value: /data/civicguard.sqlite
      - key: CIVICGUARD_REPORTS_PATH
        value: /data/reports.json
      - key: UPLOAD_DIR
        value: /data/uploads
      # Seeds 12 realistic, pre-triaged incidents into an empty volume on first
      # boot so the deployed demo is never empty. Remove for a real deployment.
      - key: SEED_DEMO_DATA
        value: "true"
    # Free plan: /data is ephemeral and resets on restart/redeploy.
    # SEED_DEMO_DATA=true repopulates the 12 demo incidents on the next boot.
    # For persistent SQLite/uploads, switch to the Starter plan and add a 1 GB
    # disk mounted at /data.
